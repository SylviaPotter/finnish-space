<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <title>Word Matching Game — 随机词表版</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <style>
    body { font-family: Arial, sans-serif; background-color: #f0f8ff; text-align: center; margin: 0; padding: 20px; }
    .word-container { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; justify-items: center; margin-top: 20px; }
    .word-column { display: flex; flex-direction: column; gap: 10px; }
    .word-card { width: 150px; padding: 20px; background-color: #ffffff; border: 2px solid #0038A8; cursor: pointer; transition: background-color 0.3s; }
    .selected { background-color: #0038A8; color: #ffffff; }
    .matched { background-color: #00cc66; color: #ffffff; cursor: default; }
    .pagination { margin-top: 20px; }
    .btn-group { margin: 20px 0; }
    button { font-size: 16px; padding: 8px 12px; margin: 5px; cursor: pointer; }
    button:hover { background-color: #eef; }
    #apiKeyContainer { margin-bottom: 20px; }
    #apiKey { padding: 8px; font-size: 14px; margin-right: 8px; border-radius: 4px; border: 1px solid #ccc; width: 220px; }
    #logContainer { max-width: 720px; margin: 20px auto; text-align: left; color: #b00; display: none; border: 1px dashed #999; padding: 10px; border-radius: 4px; background: #fff; }
    .log-toggle-container { margin-top: 30px; }
    .log-toggle-container button { font-size: 12px; padding: 5px 8px; }

    /* 已选词表展示 */
    #pickedInfo {
      max-width: 820px;
      margin: 16px auto 8px;
      padding: 12px 14px;
      background: #ffffff;
      border: 1px solid #d6e4ff;
      border-radius: 10px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.04);
      text-align: left;
      display: none;
    }
    #pickedInfo .title {
      font-size: 14px;
      color: #335;
      margin-bottom: 8px;
      opacity: 0.85;
    }
    #pickedInfo .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 8px 10px;
      align-items: center;
    }
    .chip {
      padding: 6px 10px;
      border-radius: 999px;
      border: 1px solid #c9d8ff;
      background: #f5f8ff;
      font-size: 14px;
      color: #123;
      white-space: nowrap;
    }
    .separator {
      opacity: 0.5;
      font-size: 16px;
    }
  </style>
</head>
<body>
  <h1>Word Matching Game Random</h1>

  <!-- API Key -->
  <div id="apiKeyContainer">
    <label for="apiKey">GitHub API Key：</label>
    <input type="password" id="apiKey" placeholder="available" />
    <button onclick="setApiKey()">设置</button>
  </div>

  <!-- 本地上传 -->
  <input type="file" id="fileUpload" accept=".xlsx" />

  <!-- 按钮 -->
  <div class="btn-group">
    <button onclick="startGameRandom()">开始（随机词表）</button>
    <button onclick="startGameFromLocal()">用本地xlsx开始</button>
  </div>

  <!-- 已选词表信息 -->
  <div id="pickedInfo">
    <div class="title">已选词表</div>
    <div class="chips" id="pickedChips"></div>
  </div>

  <!-- 词卡容器 -->
  <div class="word-container" id="word-container">
    <div class="word-column" id="finnish-column"></div>
    <div class="word-column" id="english-column"></div>
  </div>
  <div class="pagination" id="pagination">
    <button onclick="prevPage()" id="prevButton" disabled>上一页</button>
    <button onclick="nextPage()" id="nextButton" disabled>下一页</button>
  </div>

  <!-- 日志 -->
  <div id="logContainer"></div>
  <div class="log-toggle-container">
    <button onclick="toggleLogs()">显示/隐藏日志</button>
  </div>

<script>
/* ========================= 配置 ========================= */
const repoOwner = "SylviaPotter";
const repoName = "finnish-space";
const repoBaseUrl = `https://api.github.com/repos/${repoOwner}/${repoName}/contents/`;

// 排除路径前缀（仓库根相对路径）
const EXCLUDED_PREFIXES = [
  "files/SM1/K1/",
  "files/SM1/K2/",
];

// 近期去重策略
const HISTORY_KEY = "randomWordlistHistory";
const HISTORY_WINDOW_SIZE = 10;          // 保留最近10次
const MIN_REPICK_INTERVAL_HOURS = 12;    // 近12小时尽量不重复
const RELAX_REPICK_INTERVAL_HOURS = 6;   // 候选不足时放宽到6小时

// 每页单词数
const itemsPerPage = 5;

/* ========================= 状态 ========================= */
let apiKey = "";
let words = [];
let currentPage = 0;
let mp3Map = {};
let indexedWordlists = null; // [{path, url}]

/* ========================= 工具函数 ========================= */
function logMessage(message, isError = true) {
  const log = document.getElementById("logContainer");
  const p = document.createElement("p");
  p.textContent = (isError ? "Error: " : "") + message;
  p.style.color = isError ? "red" : "green";
  log.appendChild(p);
  if (isError) console.error(message); else console.log(message);
}

function toggleLogs() {
  const log = document.getElementById("logContainer");
  log.style.display = (log.style.display === "none" || !log.style.display) ? "block" : "none";
}

function setApiKey() {
  const input = document.getElementById("apiKey");
  apiKey = input.value.trim();
  if (apiKey) {
    logMessage("GitHub API Key 已设置。", false);
    alert("API Key has been set!");
  } else {
    logMessage("未填写API Key。可能会遇到GitHub限流。", true);
  }
}

async function fetchJSONWithAuth(url) {
  const headers = { Accept: "application/vnd.github.v3+json" };
  if (apiKey) headers["Authorization"] = `token ${apiKey}`;
  const res = await fetch(url, { headers });
  if (!res.ok) {
    if (res.status === 401) throw new Error("Invalid API Key (401)");
    if (res.status === 403) throw new Error("Rate limit exceeded or access forbidden (403)");
    throw new Error(`HTTP ${res.status} ${res.statusText}`);
  }
  return await res.json();
}

async function fetchXlsxFileContent(fileApiUrl) {
  try {
    const fileData = await fetchJSONWithAuth(fileApiUrl);
    if (!fileData.content) throw new Error("响应中没有 'content' 字段");
    const binaryString = atob(fileData.content);
    const binaryData = Uint8Array.from(binaryString, c => c.charCodeAt(0));
    return binaryData.buffer;
  } catch (err) {
    throw new Error(`获取XLSX失败: ${err.message}`);
  }
}

function readExcelBuffer(buffer) {
  const workbook = XLSX.read(buffer, { type: 'array' });
  const firstSheetName = workbook.SheetNames[0];
  const worksheet = workbook.Sheets[firstSheetName];
  const rows = XLSX.utils.sheet_to_json(worksheet, { header: 1 });
  words = rows.map(row => {
    const [fi, en] = row;
    if (fi && en) return { finnish: String(fi).trim(), english: String(en).trim() };
  }).filter(Boolean);
}

function shuffle(array) { return array.sort(() => Math.random() - 0.5); }

function secureRandomIndex(n) {
  if (n <= 0) throw new Error("secureRandomIndex: n must be > 0");
  const max = 0xFFFFFFFF;
  const limit = max - (max % n);
  let x;
  do {
    const buf = new Uint32Array(1);
    crypto.getRandomValues(buf);
    x = buf[0];
  } while (x >= limit);
  return x % n;
}

/* ========================= 目录与索引 ========================= */
async function listDir(path) {
  const url = `${repoBaseUrl}${path}`;
  const entries = await fetchJSONWithAuth(url);
  if (!Array.isArray(entries)) return [];
  return entries;
}

function isExcludedPath(p) {
  return EXCLUDED_PREFIXES.some(prefix => p.startsWith(prefix));
}

async function indexAllWordlists() {
  const result = [];
  async function dfs(dirPath) {
    let entries;
    try {
      entries = await listDir(dirPath);
    } catch (e) {
      logMessage(`读取目录失败：${dirPath} - ${e.message}`, true);
      return;
    }
    for (const it of entries) {
      if (it.type === "dir") {
        await dfs(it.path);
      } else if (it.type === "file" && it.name.endsWith(".xlsx")) {
        const fullPath = it.path; // 如 files/SM1/K3/list.xlsx
        if (!isExcludedPath(fullPath)) result.push({ path: fullPath, url: it.url });
      }
    }
  }
  await dfs("files");
  if (result.length === 0) logMessage("未找到可用的 .xlsx 词表（排除 SM1/K1、SM1/K2 后）。", true);
  return result;
}

/* ========================= 去重历史 ========================= */
function loadHistory() {
  try {
    const raw = localStorage.getItem(HISTORY_KEY);
    if (!raw) return [];
    const arr = JSON.parse(raw);
    return Array.isArray(arr) ? arr : [];
  } catch {
    return [];
  }
}

function saveHistory(history) {
  const trimmed = history.slice(-HISTORY_WINDOW_SIZE);
  localStorage.setItem(HISTORY_KEY, JSON.stringify(trimmed));
}

function inRecent(path, hours) {
  const history = loadHistory();
  const now = Date.now();
  const ms = hours * 3600 * 1000;
  return history.some(h => h.path === path && (now - h.time) < ms);
}

function pushHistory(path) {
  const history = loadHistory();
  history.push({ path, time: Date.now() });
  saveHistory(history);
}

/* ========================= 等概率随机选择 ========================= */
function pickRandomWordlist(all) {
  if (!Array.isArray(all) || all.length === 0) throw new Error("没有可随机的词表");
  let candidates = all.filter(x => !inRecent(x.path, MIN_REPICK_INTERVAL_HOURS));
  if (candidates.length === 0) {
    candidates = all.filter(x => !inRecent(x.path, RELAX_REPICK_INTERVAL_HOURS));
  }
  const pool = candidates.length > 0 ? candidates : all;
  const idx = secureRandomIndex(pool.length);
  return pool[idx];
}

/* ========================= 音频抓取 ========================= */
async function fetchMp3FilesRecursive(path) {
  const url = `${repoBaseUrl}${path}`;
  try {
    const items = await fetchJSONWithAuth(url);
    let mp3Files = [];
    for (const item of items) {
      if (item.type === 'file' && item.name.endsWith('.mp3')) {
        mp3Files.push(item);
      } else if (item.type === 'dir') {
        const sub = await fetchMp3FilesRecursive(item.path);
        mp3Files = mp3Files.concat(sub);
      }
    }
    return mp3Files;
  } catch (e) {
    logMessage(`抓取MP3失败：${path} - ${e.message}`, true);
    return [];
  }
}

function populateMp3Map(files) {
  mp3Map = {};
  files.forEach(f => {
    const base = f.name.replace(/\.mp3$/i, '');
    mp3Map[base] = f.download_url;
  });
}

/* ========================= 已选词表展示 ========================= */
function setPickedInfoVisible(show) {
  document.getElementById('pickedInfo').style.display = show ? 'block' : 'none';
}

function renderPickedInfoFromPath(path, isLocal = false) {
  const chipsBox = document.getElementById('pickedChips');
  chipsBox.innerHTML = '';

  if (isLocal) {
    const chip = document.createElement('span');
    chip.className = 'chip';
    chip.textContent = `本地文件：${path}`;
    chipsBox.appendChild(chip);
    setPickedInfoVisible(true);
    return;
  }

  // 去掉前缀并拆分
  let p = path.replace(/^audio_files\//, '').replace(/^files\//, '');
  const parts = p.split('/');

  // 去掉扩展名
  if (parts.length > 0) {
    const last = parts[parts.length - 1].replace(/\.xlsx$/i, '');
    parts[parts.length - 1] = last;
  }

  const pretty = parts.filter(Boolean);
  pretty.forEach((seg, idx) => {
    const chip = document.createElement('span');
    chip.className = 'chip';
    chip.textContent = seg;
    chipsBox.appendChild(chip);
    if (idx !== pretty.length - 1) {
      const sep = document.createElement('span');
      sep.className = 'separator';
      sep.textContent = '·'; // 可改为 '→' 或 '›'
      chipsBox.appendChild(sep);
    }
  });

  setPickedInfoVisible(true);
}

/* ========================= 渲染与交互 ========================= */
function renderPage() {
  const fiCol = document.getElementById('finnish-column');
  const enCol = document.getElementById('english-column');
  fiCol.innerHTML = ''; enCol.innerHTML = '';

  const start = currentPage * itemsPerPage;
  const end = Math.min(start + itemsPerPage, words.length);
  const pageWords = words.slice(start, end);

  pageWords.forEach(pair => {
    const fiCard = document.createElement('div');
    fiCard.classList.add('word-card');
    fiCard.textContent = pair.finnish;
    fiCard.dataset.matchId = pair.finnish;

    const enCard = document.createElement('div');
    enCard.classList.add('word-card');
    enCard.textContent = pair.english;
    enCard.dataset.matchId = pair.finnish;

    fiCol.appendChild(fiCard);
    enCol.appendChild(enCard);
  });

  shuffleColumnCards(fiCol);
  shuffleColumnCards(enCol);
  addClickEvents();
}

function shuffleColumnCards(column) {
  for (let i = column.children.length; i >= 0; i--) {
    column.appendChild(column.children[Math.random() * i | 0]);
  }
}

function addClickEvents() {
  let selectedCard = null;
  document.querySelectorAll('.word-card').forEach(card => {
    card.addEventListener('click', function() {
      const finnishWord = card.dataset.matchId;
      if (mp3Map[finnishWord]) {
        const audio = new Audio(mp3Map[finnishWord]);
        audio.play().catch(err => console.error(err));
      }
      if (card.classList.contains('matched') || card === selectedCard) return;

      card.classList.add('selected');
      if (!selectedCard) {
        selectedCard = card;
      } else {
        if (selectedCard.dataset.matchId === card.dataset.matchId) {
          selectedCard.classList.add('matched');
          card.classList.add('matched');
        }
        selectedCard.classList.remove('selected');
        card.classList.remove('selected');
        selectedCard = null;
      }
    });
  });
}

function updatePaginationButtons() {
  document.getElementById('prevButton').disabled = currentPage === 0;
  document.getElementById('nextButton').disabled = (currentPage + 1) * itemsPerPage >= words.length;
}

function nextPage() {
  if ((currentPage + 1) * itemsPerPage < words.length) {
    currentPage++; renderPage(); updatePaginationButtons();
  }
}

function prevPage() {
  if (currentPage > 0) {
    currentPage--; renderPage(); updatePaginationButtons();
  }
}

/* ========================= 启动流程 ========================= */
document.getElementById('fileUpload').addEventListener('change', function (e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(ev) {
    const data = new Uint8Array(ev.target.result);
    const wb = XLSX.read(data, { type: 'array' });
    const firstSheetName = wb.SheetNames[0];
    const ws = wb.Sheets[firstSheetName];
    const rows = XLSX.utils.sheet_to_json(ws, { header: 1 });
    words = rows.map(r => {
      const [fi, en] = r;
      if (fi && en) return { finnish: String(fi).trim(), english: String(en).trim() };
    }).filter(Boolean);
    logMessage("本地Excel读取成功。", false);
    renderPickedInfoFromPath(file.name, true);
    words = shuffle(words); currentPage = 0; renderPage(); updatePaginationButtons();
  };
  reader.readAsArrayBuffer(file);
});

function startGameFromLocal() {
  const fileInput = document.getElementById('fileUpload');
  if (!fileInput.files || fileInput.files.length === 0) {
    alert("请先选择一个本地 .xlsx 文件");
    return;
  }
  // 读取后会自动渲染
}

async function startGameRandom() {
  try {
    if (!indexedWordlists) {
      indexedWordlists = await indexAllWordlists();
    }
    if (!indexedWordlists || indexedWordlists.length === 0) {
      alert("没有可用词表（排除了 SM1/K1、SM1/K2）。");
      return;
    }

    const chosen = pickRandomWordlist(indexedWordlists);
    renderPickedInfoFromPath(chosen.path, false);
    pushHistory(chosen.path);

    const buffer = await fetchXlsxFileContent(chosen.url);
    readExcelBuffer(buffer);

    // 推测音频目录：files/SM1/K3/list.xlsx -> audio_files/files/SM1/K3
    const unitDir = chosen.path.replace(/\/[^/]+\.xlsx$/i, "");
    const audioPath = `audio_files/${unitDir}`;
    const mp3Files = await fetchMp3FilesRecursive(audioPath);
    populateMp3Map(mp3Files);

    words = shuffle(words);
    currentPage = 0;
    renderPage(); updatePaginationButtons();
  } catch (e) {
    logMessage(`随机启动失败：${e.message}`, true);
    alert("随机开始失败，请查看日志。");
  }
}
</script>
</body>
</html>
